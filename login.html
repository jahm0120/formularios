<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logín</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/Google_Forms_Logo_512px.webp" type="image/x-icon">
</head>
<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Inicio de sesión</legend>
                    <p>Ingresa tus credenciales para acceder a la cuenta</p>

                    <label for="">Correo electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com" required>

                    <label for="">Comtraseña</label>
                    <input type="password" placeholder="*********" required>

                    <label for="">Recordarme</label>
                    <input type="checkbox">

                    <input type="submit" value="Iniciar sesión">
                    <input type="reset" value="Limpiar">
                    
                    <p class="enlace">¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </fieldset>
            </form>
        </section>
    </main>
    
</body>
</html>
